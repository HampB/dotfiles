"$schema" = 'https://starship.rs/config-schema.json'

# Right side: short left (folder + arrow), details on the right.
add_newline = false
format = "$directory$character"
right_format = "$git_branch$git_status$python$cmd_duration$status"

[directory]
style = "blue"
truncation_length = 1
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "purple"
format = "[$branch]($style) "

[git_status]
style = "yellow"
format = "[($modified$staged$untracked$conflicted$ahead_behind )]($style)"
modified = "*"
staged = "+"
untracked = "?"
conflicted = "!"

[python]
symbol = ""
style = "dimmed white"
format = "[py $version]($style) "

[cmd_duration]
min_time = 3000
style = "dimmed white"
format = "[$duration]($style) "

[status]
disabled = false
style = "red"
format = "[✗ $status]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
