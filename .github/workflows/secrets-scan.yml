name: secrets-scan

# Scans every push and PR for secrets with gitleaks. Complements GitHub push protection,
# which only knows provider token formats; gitleaks also catches generic keys/passwords.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
