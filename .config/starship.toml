
add_newline = true

format = """$env_var$os$username$hostname$kubernetes$directory$git_branch$git_status$python
$character
"""

[env_var]
variable = 'SHELL'
format = "$symbol"
disabled = false

[os]
format = '[$symbol](bold white) '   
disabled = false

# Shows the username
[username]
style_user = 'yellow bold'
style_root = 'black bold'
format = '[//](black bold) [$user](#2883ff) ' # 2883ff
disabled = false
show_always = true

# Shows the hostname
[hostname]
ssh_only = true
format = '[//](black bold) [$hostname](bold blue) '
disabled = false

# Shows current directory
[directory]
home_symbol = '~'
format = '[//](black bold) [$path]($style)[$read_only]($read_only_style) '
style = '#7ed1fb' # yellow bold


# Shows current git branch
[git_branch]
format = '[//](black bold) [\[$branch\]]($style) '
style = 'bold green'

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold purple) '
disabled = false


[python]
format = '[//](black bold) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '